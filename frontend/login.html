<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | LearnSphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-container">
    <div class="auth-hero">
        <div class="auth-hero-content">
            <h1>Welcome to <br /><span style="color: #93C5FD;">LearnSphere</span></h1>
            <p>Sign in with your demo or registered account to open your dashboard.</p>
        </div>
    </div>

    <div class="auth-form-side">
        <a href="index.html" class="logo">LearnSphere</a>

        <div class="auth-form-header">
            <h2>Sign in</h2>
            <p>Use your email and password to continue.</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required autocomplete="username">
            </div>
            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <p style="margin-top: 2rem; color: var(--text-muted); font-size: 0.9375rem; text-align: center;">
            New here? <a href="signup.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create an account</a>
        </p>
    </div>
</div>

<footer class="footer" style="position: fixed; bottom: 0; width: 45%; right: 0; background: white; border-top: none; padding: 1.5rem;">
    <p>LearnSphere &copy; 2026 · Sudhakar Kalathi</p>
</footer>

<script src="js/main.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        try {
            const response = await apiFetch('/auth/login', {
                method: 'POST',
                body: { email, password }
            });
            localStorage.setItem('jwtToken', response.token);
            localStorage.setItem('userRole', response.role);
            localStorage.setItem('userName', response.name);
            if (response.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
            else if (response.role === 'INSTRUCTOR') window.location.href = 'instructor-dashboard.html';
            else window.location.href = 'student-dashboard.html';
        } catch (error) {
            alert(error.message || 'Sign in failed. Check the backend is running and credentials are correct.');
        }
    });
</script>
</body>
</html>
