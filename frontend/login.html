<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Ease Everything</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-main">

<nav class="navbar">
    <a href="index.html" class="logo">Ease Everything</a>
</nav>

<div class="auth-page">
    <div class="auth-card glass">
        <h2 style="margin-bottom: 0.5rem;">Welcome Back</h2>
        <p style="color:var(--text-muted); margin-bottom: 2rem;">Log in to continue your learning journey.</p>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email (e.g. admin@example.com)" required>
            <input type="password" id="loginPassword" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>
        <p style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">
            New to the platform? <a href="signup.html" style="color: var(--primary); font-weight: 700; text-decoration: none;">Create an Account</a>
        </p>
    </div>
</div>

<footer class="footer">
    <p>Ease Everything &copy; 2026</p>
    <p style="margin-top: 0.5rem; font-weight: 500;">Designed & Developed by <strong>Sudhakar Kalathi</strong></p>
</footer>

<script src="js/main.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;
        try {
            const response = await apiFetch('/auth/login', {
                method: 'POST',
                body: { email, password }
            });
            localStorage.setItem('jwtToken', response.token);
            localStorage.setItem('userRole', response.role);
            localStorage.setItem('userName', response.name);
            if(response.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
            else if(response.role === 'INSTRUCTOR') window.location.href = 'instructor-dashboard.html';
            else window.location.href = 'student-dashboard.html';
        } catch (error) { alert(error.message || 'Login failed'); }
    });
</script>
</body>
</html>
