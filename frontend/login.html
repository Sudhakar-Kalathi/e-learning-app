<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Ease Everything</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<nav class="navbar">
    <div class="logo">Ease Everything</div>
</nav>

<div class="auth-page">
    <div class="auth-card">
        <h2>Login</h2>
        <form id="loginForm">
            <input type="email" id="loginEmail" placeholder="Email">
            <input type="password" id="loginPassword" placeholder="Password">
            <button type="submit">Login</button>
        </form>
        <p>Don’t have an account? <a href="signup.html">Sign up</a></p>
    </div>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
            const response = await apiFetch('/auth/login', {
                method: 'POST',
                body: { email, password }
            });

            localStorage.setItem('jwtToken', response.token);
            localStorage.setItem('userRole', response.role);
            localStorage.setItem('userName', response.name);
            
            alert('Login successful!');

            if(response.role === 'ADMIN') window.location.href = 'admin-dashboard.html';
            else if(response.role === 'INSTRUCTOR') window.location.href = 'instructor-dashboard.html';
            else window.location.href = 'student-dashboard.html';
            
        } catch (error) {
            alert(error.message || 'Login failed');
        }
    });
</script>

<script src="js/main.js"></script>
</body>
</html>
