<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson | LearnSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .player-wrapper {
            background: #111827;
            border-radius: var(--radius-lg);
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
            position: relative;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }
        .player-overlay {
            position: absolute;
            z-index: 2;
            background: rgba(0,0,0,0.45);
            color: white;
            padding: 1rem 2rem;
            border-radius: 999px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: var(--transition);
        }
        .player-overlay:hover { transform: scale(1.03); background: var(--primary); }
    </style>
</head>
<body class="bg-main">

<nav class="nav-top">
    <div class="nav-inner">
        <a href="index.html" class="logo" style="text-decoration: none; font-size: 1.5rem; color: var(--slate-900);">LearnSphere</a>
        <div class="nav-links"></div>
    </div>
</nav>

<main style="max-width: 1200px; margin: auto; padding: 2rem 1.5rem 4rem; display: grid; grid-template-columns: 1fr; gap: 2rem;">
    <style>
        @media (min-width: 960px) {
            .lesson-main { grid-template-columns: 1fr 300px !important; }
        }
    </style>
    <div class="lesson-main" style="display: grid; grid-template-columns: 1fr; gap: 2rem;">
        <section>
            <div class="player-wrapper">
                <div class="player-overlay" id="playHint" role="button" tabindex="0">
                    <span style="font-size: 1.25rem;">▶</span> Lesson content
                </div>
                <div style="position:absolute; inset:0; background: radial-gradient(circle at center, #1E1B4B 0%, #0F172A 100%);"></div>
            </div>

            <header style="margin-bottom: 2rem;">
                <span class="badge badge-indigo" id="lessonBadge" style="margin-bottom: 1rem;">Lesson</span>
                <h1 id="lessonTitle" style="font-size: clamp(1.5rem, 3vw, 2.25rem); font-weight: 800; color: var(--slate-900);">Introduction</h1>
                <p id="lessonMeta" style="font-size: 0.875rem; font-weight: 600; color: var(--text-muted); margin-top: 0.5rem;"></p>
                <p style="font-size: 1.05rem; color: var(--text-muted); line-height: 1.75; margin-top: 1rem;">
                    Follow along with the materials linked from your instructor. This page is a structured view for the lesson flow — connect the backend to serve real video URLs per lesson.
                </p>
            </header>

            <div style="display: flex; gap: 1rem; flex-wrap: wrap; border-top: 1.5px solid var(--slate-100); padding-top: 2rem;">
                <button type="button" class="btn btn-primary" style="width: auto; padding: 0.9rem 2rem;" onclick="window.location.href='quiz.html'">Unit quiz</button>
                <a id="backCourse" href="courses.html" class="btn" style="width: auto; padding: 0.9rem 1.5rem; text-decoration: none; background: white; border: 1.5px solid var(--slate-200); color: var(--slate-900);">Back to course</a>
            </div>
        </section>

        <aside>
            <div class="card" style="padding: 1.75rem; border-radius: var(--radius-lg);">
                <h3 style="font-size: 1rem; font-weight: 800; margin-bottom: 1rem;">This course</h3>
                <p id="courseBlurb" style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.6;">—</p>
            </div>
        </aside>
    </div>
</main>

<footer class="footer">
    <p>LearnSphere &copy; 2026 · Sudhakar Kalathi</p>
</footer>

<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const courseId = params.get('courseId');
        const lessonId = params.get('lessonId');
        const backCourse = document.getElementById('backCourse');
        if (courseId) backCourse.href = 'course-detail.html?id=' + encodeURIComponent(courseId);

        if (!courseId || !lessonId) {
            document.getElementById('lessonTitle').textContent = 'Lesson';
            document.getElementById('lessonMeta').textContent = 'Open this page from a course to load context.';
            return;
        }

        try {
            const data = await catalogFetch('/catalog/courses/' + courseId);
            const course = data.course;
            const lessons = data.lessons || [];
            const lesson = lessons.find(l => String(l.id) === String(lessonId));
            document.getElementById('courseBlurb').textContent = course.description || '';
            if (lesson) {
                document.getElementById('lessonTitle').textContent = lesson.title;
                document.title = lesson.title + ' | LearnSphere';
                document.getElementById('lessonBadge').textContent = 'Lesson · ' + course.title;
                document.getElementById('lessonMeta').textContent = lesson.contentUrl ? 'Material: ' + lesson.contentUrl : '';
            }
        } catch (e) {
            document.getElementById('courseBlurb').textContent = 'Could not load course details. Is the API running?';
        }
    });
</script>
</body>
</html>
