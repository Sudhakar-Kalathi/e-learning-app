<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course catalog | LearnSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .course-page-card {
            border-radius: var(--radius-lg);
            padding: 2rem;
            background: white;
            border: 1.5px solid var(--slate-100);
            transition: var(--transition);
            text-decoration: none;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            color: inherit;
        }
        .course-page-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }
    </style>
</head>
<body class="bg-main">

<nav class="nav-top">
    <div class="nav-inner">
        <a href="index.html" class="logo" style="text-decoration: none; font-size: 1.5rem; color: var(--slate-900);">LearnSphere</a>
        <div class="nav-links"></div>
    </div>
</nav>

<header style="padding: 5rem 5% 4rem 5%; text-align: center; background: radial-gradient(circle at top, #EEF2FF 0%, #F8FAFC 100%);">
    <div style="max-width: 720px; margin: auto;">
        <span class="badge badge-indigo" style="margin-bottom: 1rem;">Catalog</span>
        <h1 style="font-size: clamp(2rem, 4vw, 3rem); font-weight: 800; line-height: 1.15; margin-bottom: 1rem; color: var(--slate-900);">Explore <span style="color: var(--primary);">courses</span></h1>
        <p style="font-size: 1.1rem; color: var(--text-muted); line-height: 1.6;">Data loads from the public API when the backend is running. Otherwise you will see a short message below.</p>
    </div>
</header>

<section style="padding: 3rem 8% 6rem; background: white; min-height: 50vh;">
    <div class="stat-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem;" id="courseList">
        <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 3rem;">Loading courses…</p>
    </div>
</section>

<footer class="footer">
    <div style="max-width: 1200px; margin: auto; text-align: center;">
        <a href="index.html" class="logo" style="text-decoration: none; font-size: 1.25rem; color: var(--slate-900);">LearnSphere</a>
        <p style="margin-top: 1rem;">LearnSphere &copy; 2026 · Sudhakar Kalathi</p>
    </div>
</footer>

<script src="js/main.js"></script>
<script>
    function badgeForTitle(title) {
        const t = (title || '').toLowerCase();
        if (t.includes('java')) return { cls: 'badge-indigo', label: 'Programming' };
        if (t.includes('frontend') || t.includes('css')) return { cls: '', style: 'background:#FDF4FF;color:#A855F7;', label: 'Web' };
        if (t.includes('spring')) return { cls: 'badge-emerald', label: 'Backend' };
        return { cls: 'badge-indigo', label: 'Course' };
    }

    document.addEventListener('DOMContentLoaded', async () => {
        const container = document.getElementById('courseList');
        try {
            const courses = await catalogFetch('/catalog/courses');
            if (!courses || courses.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:3rem;">No courses yet. Start the backend — seed data creates sample courses.</p>';
                return;
            }
            container.innerHTML = '';
            courses.forEach(c => {
                const b = badgeForTitle(c.title);
                const badgeHtml = b.style
                    ? `<span class="badge" style="${b.style}">${b.label}</span>`
                    : `<span class="badge ${b.cls}">${b.label}</span>`;
                container.innerHTML += `
                    <a href="course-detail.html?id=${c.id}" class="course-page-card">
                        ${badgeHtml}
                        <h3 style="font-size: 1.35rem; color: var(--slate-900);">${c.title}</h3>
                        <p style="color: var(--text-muted); line-height: 1.65; flex: 1;">${c.description || ''}</p>
                        <div style="margin-top: auto; padding-top: 0.5rem; color: var(--primary); font-weight: 700;">Open course →</div>
                    </a>`;
            });
        } catch (e) {
            container.innerHTML = `
                <div style="grid-column:1/-1; max-width:560px; margin:auto; text-align:center; padding:2rem; border:1.5px dashed var(--slate-200); border-radius:var(--radius-lg); background:var(--slate-50);">
                    <p style="color:var(--slate-700); margin-bottom:1rem;">Could not reach the API at <strong>http://localhost:8080</strong>.</p>
                    <p style="color:var(--text-muted); font-size:0.9375rem;">Run the Spring Boot app from <code>backend/</code>, then refresh this page.</p>
                </div>`;
        }
    });
</script>
</body>
</html>
