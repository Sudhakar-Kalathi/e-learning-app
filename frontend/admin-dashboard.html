<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard | Ease Everything</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .dashboard-container { padding: 40px 20px; max-width: 1200px; margin: auto; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
        .stat-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        .stat-card h3 { margin: 0; color: #666; font-size: 16px; }
        .stat-card .value { font-size: 32px; font-weight: bold; color: #007bff; margin: 10px 0 0; }
        .users-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .users-table th, .users-table td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        .users-table th { background: #f8f9fa; font-weight: 600; color: #333; }
        .btn-delete { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="logo">Ease Everything</div>
    <div class="menu-toggle">☰</div>
    <ul class="nav-links">
        <!-- Injected via JS -->
    </ul>
</nav>

<div class="dashboard-container">
    <h2>Admin Dashboard</h2>
    <p>Welcome, <span id="adminName"></span></p>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><h3>Loading...</h3></div>
    </div>

    <h3>All Users</h3>
    <table class="users-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="usersTableBody">
            <tr><td colspan="5" style="text-align: center;">Loading...</td></tr>
        </tbody>
    </table>
</div>

<script src="js/main.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const role = localStorage.getItem("userRole");
        if (role !== "ADMIN") {
            window.location.href = "login.html";
            return;
        }

        document.getElementById('adminName').textContent = localStorage.getItem('userName');
        await loadStats();
        await loadUsers();
    });

    async function loadStats() {
        try {
            const stats = await apiFetch('/admin/stats');
            const grid = document.getElementById('statsGrid');
            grid.innerHTML = `
                <div class="stat-card"><h3>Total Users</h3><div class="value">${stats.totalUsers}</div></div>
                <div class="stat-card"><h3>Instructors</h3><div class="value">${stats.totalInstructors}</div></div>
                <div class="stat-card"><h3>Students</h3><div class="value">${stats.totalStudents}</div></div>
                <div class="stat-card"><h3>Total Courses</h3><div class="value">${stats.totalCourses}</div></div>
                <div class="stat-card"><h3>Enrollments</h3><div class="value">${stats.totalEnrollments}</div></div>
            `;
        } catch (error) {
            console.error(error);
        }
    }

    async function loadUsers() {
        try {
            const users = await apiFetch('/admin/users');
            const tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';
            
            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td><span style="padding:4px 8px;border-radius:12px;background:#e9ecef;font-size:12px">${user.role}</span></td>
                        <td>
                            <button class="btn-delete" onclick="deleteUser(${user.id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
        } catch (error) {
            console.error(error);
        }
    }

    async function deleteUser(id) {
        if (!confirm("Are you sure you want to delete this user?")) return;
        try {
            await apiFetch(`/admin/users/${id}`, { method: 'DELETE' });
            alert("User deleted");
            loadUsers();
            loadStats();
        } catch (error) {
            alert(error.message);
        }
    }
</script>
</body>
</html>
