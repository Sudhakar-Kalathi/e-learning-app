<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | LearnSphere</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="sidebar">
        <a href="index.html" class="logo">LearnSphere</a>
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-link active">Overview</a>
            <a href="courses.html" class="sidebar-link">Catalog</a>
        </nav>
        <div style="margin-top: auto; padding-top: 2rem; border-top: 1px dotted var(--slate-200);">
            <a href="#" onclick="logout(); return false;" style="color: var(--error); text-decoration: none; font-weight: 700; font-size: 0.9rem;">Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Admin</h1>
                <p>Hello, <strong id="adminName">Admin</strong>.</p>
            </div>
            <div style="display:flex; align-items:center; gap:0.5rem; background:white; padding:0.5rem 1rem; border-radius:99px; border:1px solid var(--slate-200); box-shadow:var(--shadow-sm);">
                <span style="width:8px; height:8px; background:var(--success); border-radius:50%;"></span>
                <span style="font-size:0.85rem; font-weight:700;">API</span>
            </div>
        </header>

        <section class="stat-grid">
            <div class="card stat-card" style="border-top: 4px solid var(--primary);">
                <div class="label">Users</div>
                <div class="value" id="valTotalUsers">—</div>
            </div>
            <div class="card stat-card" style="border-top: 4px solid var(--success);">
                <div class="label">Instructors</div>
                <div class="value" id="valTotalInstructors">—</div>
            </div>
            <div class="card stat-card" style="border-top: 4px solid var(--warning);">
                <div class="label">Students</div>
                <div class="value" id="valTotalStudents">—</div>
            </div>
            <div class="card stat-card" style="border-top: 4px solid #3B82F6;">
                <div class="label">Courses</div>
                <div class="value" id="valTotalCourses">—</div>
            </div>
        </section>

        <section class="card" style="padding: 0; overflow: hidden;">
            <div style="padding: 1.5rem; border-bottom: 1.5px solid var(--slate-100); display: flex; justify-content: space-between; align-items: center;">
                <h2 style="font-size: 1.1rem; font-weight: 700;">Users</h2>
            </div>
            <div style="overflow-x: auto;">
                <table class="table-glass">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th style="text-align: right;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <tr><td colspan="5" style="text-align: center; padding: 3rem; color: var(--text-muted);">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <footer class="footer">
            <p>LearnSphere &copy; 2026 · Sudhakar Kalathi</p>
        </footer>
    </main>
</div>

<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const role = localStorage.getItem('userRole');
        if (role !== 'ADMIN') { window.location.href = 'login.html'; return; }
        document.getElementById('adminName').textContent = localStorage.getItem('userName') || 'Admin';
        await loadStats();
        await loadUsers();
    });

    async function loadStats() {
        try {
            const stats = await apiFetch('/admin/stats');
            document.getElementById('valTotalUsers').textContent = stats.totalUsers;
            document.getElementById('valTotalInstructors').textContent = stats.totalInstructors;
            document.getElementById('valTotalStudents').textContent = stats.totalStudents;
            document.getElementById('valTotalCourses').textContent = stats.totalCourses;
        } catch (e) {
            console.error(e);
        }
    }

    async function loadUsers() {
        const tbody = document.getElementById('usersTableBody');
        try {
            const users = await apiFetch('/admin/users');
            tbody.innerHTML = '';
            users.forEach(user => {
                let badgeClass = 'badge badge-indigo';
                let badgeStyle = '';
                if (user.role === 'STUDENT') { badgeClass = 'badge badge-emerald'; }
                if (user.role === 'INSTRUCTOR') { badgeClass = 'badge'; badgeStyle = 'style="background:#F3E8FF;color:#6B21A8;"'; }
                tbody.innerHTML += `
                    <tr>
                        <td style="color: var(--text-muted); font-weight: 600;">#${user.id}</td>
                        <td style="font-weight: 700;">${user.name}</td>
                        <td>${user.email}</td>
                        <td><span class="${badgeClass}" ${badgeStyle}>${user.role}</span></td>
                        <td style="text-align: right;">
                            <button type="button" onclick="deleteUser(${user.id})" style="background: none; border: none; color: var(--error); font-weight: 700; cursor: pointer; font-size: 0.8rem;">Remove</button>
                        </td>
                    </tr>`;
            });
        } catch (e) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:2rem;">Failed to load users.</td></tr>';
        }
    }

    async function deleteUser(id) {
        if (!confirm('Remove this user?')) return;
        try {
            await apiFetch(`/admin/users/${id}`, { method: 'DELETE' });
            loadUsers();
            loadStats();
        } catch (error) {
            alert(error.message);
        }
    }
</script>
</body>
</html>
