<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instructor | LearnSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .sidebar { background: #1E1B4B; }
        .sidebar .logo { color: white; }
        .sidebar-link { color: rgba(255,255,255,0.65); }
        .sidebar-link:hover { background: rgba(255,255,255,0.06); color: white; }
        .sidebar-link.active { background: rgba(255,255,255,0.1); color: white; border-left: 3px solid #818CF8; border-radius: 0 8px 8px 0; }
        .studio-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }
        @media (min-width: 1024px) {
            .studio-grid { grid-template-columns: 1.3fr 0.7fr; }
        }
        .course-card { padding: 1.25rem; border-radius: var(--radius-md); transition: var(--transition); cursor: pointer; border: 1.5px solid var(--slate-100); margin-bottom: 0.75rem; }
        .course-card:hover { border-color: var(--primary); transform: translateY(-3px); box-shadow: var(--shadow-md); }
        .empty-state { text-align: center; padding: 4rem 1.5rem; border: 2px dashed var(--slate-200); border-radius: var(--radius-lg); color: var(--text-muted); }
    </style>
</head>
<body>

<div class="dashboard-wrapper">
    <aside class="sidebar">
        <a href="index.html" class="logo">LearnSphere</a>
        <nav class="sidebar-nav">
            <a href="#" class="sidebar-link active">Courses</a>
            <a href="courses.html" class="sidebar-link">Public catalog</a>
        </nav>
        <div style="margin-top: auto; padding-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1);">
            <a href="#" onclick="logout(); return false;" style="color: #FCA5A5; text-decoration: none; font-weight: 700;">Logout</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="page-header">
            <div>
                <h1 style="color: #1E1B4B;">Instructor studio</h1>
                <p>Create courses, lessons, and assignments.</p>
            </div>
            <button type="button" class="btn btn-primary" style="width: auto; padding: 0.75rem 1.5rem; background: #7C3AED;" onclick="document.getElementById('publishModal').style.display='flex'">New course</button>
        </header>

        <div class="studio-grid">
            <section class="card" style="padding: 2rem; border-radius: var(--radius-lg);">
                <h2 style="font-size: 1.1rem; font-weight: 700; margin-bottom: 1.5rem;">Your courses</h2>
                <div id="courseList">
                    <p style="color: var(--text-muted);">Loading…</p>
                </div>
            </section>

            <aside id="builderSidebar">
                <div class="card" id="editorPlaceholder" style="text-align: center; border-style: dashed; padding: 3rem 1.5rem; background: var(--slate-50);">
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Select a course to add lessons and assignments.</p>
                </div>

                <div class="card" id="editorActual" style="padding: 2rem; border-radius: var(--radius-lg); display: none;">
                    <h3 id="builderTitle" style="font-size: 0.95rem; color: #7C3AED; margin-bottom: 1.5rem;">Editor</h3>

                    <div style="background: var(--slate-50); padding: 1.25rem; border-radius: var(--radius-md); margin-bottom: 1rem; border: 1px solid var(--slate-100);">
                        <h4 style="margin-bottom: 1rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;">Lessons</h4>
                        <form id="addLessonForm">
                            <input type="hidden" id="lessonCourseId">
                            <div class="form-group"><input type="text" id="lessonTitle" class="form-input" placeholder="Lesson title" required></div>
                            <div class="form-group"><input type="text" id="lessonUrl" class="form-input" placeholder="Content URL" required></div>
                            <button type="submit" class="btn" style="background: #4F46E5; color: white; padding: 0.65rem; font-size: 0.875rem;">Add lesson</button>
                        </form>
                    </div>

                    <div style="background: #FDF4FF; padding: 1.25rem; border-radius: var(--radius-md); border: 1px solid #FAE8FF;">
                        <h4 style="margin-bottom: 1rem; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;">Assignments</h4>
                        <form id="addAssignmentForm">
                            <input type="hidden" id="assignmentCourseId">
                            <div class="form-group"><input type="text" id="assignmentTitle" class="form-input" placeholder="Title" required></div>
                            <div class="form-group"><textarea id="assignmentDesc" class="form-input" placeholder="Description" required rows="4"></textarea></div>
                            <button type="submit" class="btn" style="background: #A855F7; color: white; padding: 0.65rem; font-size: 0.875rem;">Add assignment</button>
                        </form>
                    </div>
                </div>
            </aside>
        </div>

        <footer class="footer">
            <p>LearnSphere &copy; 2026 · Sudhakar Kalathi</p>
        </footer>
    </main>
</div>

<div id="publishModal" style="display:none; position:fixed; inset:0; background:rgba(15,23,42,0.55); z-index:200; align-items:center; justify-content:center; backdrop-filter:blur(8px);">
    <div class="card" style="width: 100%; max-width: 520px; padding: 2.5rem; border-radius: var(--radius-lg); position:relative; box-shadow: var(--shadow-lg); margin: 1rem;">
        <button type="button" onclick="document.getElementById('publishModal').style.display='none'" style="position:absolute; top:1.25rem; right:1.25rem; border:none; background:none; font-size: 1.75rem; cursor:pointer; color: var(--text-muted); line-height: 1;">&times;</button>
        <h2 style="text-align: center; margin-bottom: 0.35rem;">New course</h2>
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 2rem;">Describe what students will learn.</p>
        <form id="createCourseForm">
            <div class="form-group"><input type="text" id="courseTitle" class="form-input" placeholder="Title" required></div>
            <div class="form-group"><textarea id="courseDesc" class="form-input" placeholder="Description" required rows="5"></textarea></div>
            <button type="submit" class="btn btn-primary" style="background: #7C3AED; padding: 1rem; margin-top: 0.5rem;">Create</button>
        </form>
    </div>
</div>

<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const role = localStorage.getItem('userRole');
        if (role !== 'INSTRUCTOR') { window.location.href = 'login.html'; return; }
        await loadCourses();
    });

    async function loadCourses() {
        const list = document.getElementById('courseList');
        try {
            const courses = await apiFetch('/instructor/courses');
            if (courses.length === 0) {
                list.innerHTML = '<div class="empty-state"><p>No courses yet.</p><small>Create your first course with the button above.</small></div>';
                return;
            }
            list.innerHTML = '';
            courses.forEach(c => {
                const row = document.createElement('div');
                row.className = 'course-card';
                row.onclick = () => openStudio(c.id, c.title);
                const desc = (c.description || '').length > 120 ? c.description.substring(0, 120) + '…' : (c.description || '');
                row.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; gap: 1rem;">
                        <div>
                            <h4 style="font-weight: 800; color: #1E1B4B; font-size: 1.05rem; margin-bottom: 0.35rem;">${escapeHtml(c.title)}</h4>
                            <p style="font-size: 0.85rem; color: var(--text-muted);">${escapeHtml(desc)}</p>
                        </div>
                        <span style="font-size: 0.7rem; font-weight: 800; color: #7C3AED; text-transform: uppercase; white-space: nowrap;">Edit</span>
                    </div>`;
                list.appendChild(row);
            });
        } catch (e) {
            list.innerHTML = '<p style="color:var(--error);">Could not load courses.</p>';
        }
    }

    function escapeHtml(s) {
        const d = document.createElement('div');
        d.textContent = s;
        return d.innerHTML;
    }

    function openStudio(id, title) {
        document.getElementById('editorPlaceholder').style.display = 'none';
        document.getElementById('editorActual').style.display = 'block';
        document.getElementById('builderTitle').textContent = 'Editing: ' + title;
        document.getElementById('lessonCourseId').value = id;
        document.getElementById('assignmentCourseId').value = id;
    }

    document.getElementById('createCourseForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await apiFetch('/instructor/courses', {
                method: 'POST',
                body: {
                    title: document.getElementById('courseTitle').value,
                    description: document.getElementById('courseDesc').value
                }
            });
            document.getElementById('publishModal').style.display = 'none';
            window.location.reload();
        } catch (error) {
            alert(error.message);
        }
    });

    document.getElementById('addLessonForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const cid = document.getElementById('lessonCourseId').value;
        if (!cid) { alert('Select a course first.'); return; }
        try {
            await apiFetch(`/instructor/courses/${cid}/lessons`, {
                method: 'POST',
                body: {
                    title: document.getElementById('lessonTitle').value,
                    contentUrl: document.getElementById('lessonUrl').value
                }
            });
            alert('Lesson saved.');
            document.getElementById('addLessonForm').reset();
        } catch (err) {
            alert(err.message);
        }
    });

    document.getElementById('addAssignmentForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const cid = document.getElementById('assignmentCourseId').value;
        if (!cid) { alert('Select a course first.'); return; }
        try {
            await apiFetch(`/instructor/courses/${cid}/assignments`, {
                method: 'POST',
                body: {
                    title: document.getElementById('assignmentTitle').value,
                    description: document.getElementById('assignmentDesc').value
                }
            });
            alert('Assignment added.');
            document.getElementById('addAssignmentForm').reset();
        } catch (err) {
            alert(err.message);
        }
    });
</script>
</body>
</html>
