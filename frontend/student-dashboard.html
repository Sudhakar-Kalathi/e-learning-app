<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My learning | LearnSphere</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .tab-switcher { display: flex; gap: 1.5rem; border-bottom: 1.5px solid var(--slate-100); margin-bottom: 2.5rem; flex-wrap: wrap; }
        .tab-btn { padding: 1rem 0; cursor: pointer; color: var(--text-muted); font-weight: 700; font-size: 1rem; border-bottom: 3px solid transparent; transition: var(--transition); background: none; border-left: none; border-right: none; border-top: none; font-family: inherit; }
        .tab-btn.active { color: var(--primary); border-color: var(--primary); }
        .journey-card { border-radius: var(--radius-lg); overflow: hidden; border: 1.5px solid var(--slate-100); transition: var(--transition); background: white; height: 100%; display: flex; flex-direction: column; }
        .journey-card:hover { transform: translateY(-6px); border-color: var(--primary); box-shadow: var(--shadow-lg); }
        .journey-card-content { padding: 2rem; flex: 1; display: flex; flex-direction: column; }
        .progress-bar { height: 10px; background: var(--slate-100); border-radius: 99px; margin-top: 1.5rem; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #4F46E5 0%, #3B82F6 100%); border-radius: 99px; transition: width 0.8s ease; }
    </style>
</head>
<body class="bg-main">

<nav class="nav-top">
    <div class="nav-inner">
        <a href="index.html" class="logo" style="text-decoration: none; font-size: 1.5rem; color: var(--slate-900);">LearnSphere</a>
        <div class="nav-links"></div>
    </div>
</nav>

<main style="max-width: 1100px; margin: auto; padding: 3rem 1.5rem 5rem;">
    <header style="margin-bottom: 2rem;">
        <h1 style="font-size: clamp(1.75rem, 4vw, 2.5rem); font-weight: 800; color: var(--slate-900);">My learning</h1>
        <p style="color: var(--text-muted); font-size: 1.05rem;">Signed in as <strong id="studentName">Student</strong></p>
    </header>

    <div class="tab-switcher">
        <button type="button" class="tab-btn active" onclick="switchTab('enrolled', this)">Enrolled</button>
        <button type="button" class="tab-btn" onclick="switchTab('available', this)">Browse catalog</button>
    </div>

    <div id="enrolledCoursesView" class="stat-grid" style="grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
        <p style="padding: 3rem; color: var(--text-muted); grid-column: 1/-1; text-align: center;">Loading…</p>
    </div>

    <div id="availableCoursesView" class="stat-grid" style="display: none; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));">
        <p style="padding: 3rem; color: var(--text-muted); grid-column: 1/-1; text-align: center;">Loading…</p>
    </div>
</main>

<footer class="footer">
    <p>LearnSphere &copy; 2026 · Sudhakar Kalathi</p>
</footer>

<script src="js/main.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', async () => {
        const role = localStorage.getItem('userRole');
        if (role !== 'STUDENT') { window.location.href = 'login.html'; return; }
        document.getElementById('studentName').textContent = localStorage.getItem('userName') || 'Student';
        await loadEnrolledCourses();
        await loadAvailableCourses();
    });

    function switchTab(tab, el) {
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        if (tab === 'enrolled') {
            document.getElementById('enrolledCoursesView').style.display = 'grid';
            document.getElementById('availableCoursesView').style.display = 'none';
        } else {
            document.getElementById('enrolledCoursesView').style.display = 'none';
            document.getElementById('availableCoursesView').style.display = 'grid';
        }
    }

    async function loadEnrolledCourses() {
        const container = document.getElementById('enrolledCoursesView');
        try {
            const enrollments = await apiFetch('/student/enrollments');
            if (enrollments.length === 0) {
                container.innerHTML = '<div style="grid-column:1/-1; padding:4rem; text-align:center; border:2px dashed var(--slate-200); border-radius:var(--radius-lg); background:white;"><p style="color:var(--text-muted);">No enrollments yet. Browse the catalog and enroll in a course.</p></div>';
                return;
            }
            container.innerHTML = '';
            enrollments.forEach(enr => {
                container.innerHTML += `
                    <div class="journey-card">
                        <div class="journey-card-content">
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.25rem;">
                                <span class="badge badge-indigo">Enrolled</span>
                                <span style="font-size: 0.8rem; font-weight: 800; color: var(--slate-700);">${enr.progressPercentage}%</span>
                            </div>
                            <h3 style="font-size: 1.35rem; font-weight: 800; color: var(--slate-900); margin-bottom:1rem;">${enr.course.title}</h3>
                            <p style="color: var(--text-muted); font-size: 0.95rem; line-height: 1.6;">${enr.course.description || ''}</p>
                            <div class="progress-bar">
                                <div class="progress-fill" style="width: ${enr.progressPercentage}%"></div>
                            </div>
                            <button type="button" onclick="window.location.href='course-detail.html?id=${enr.course.id}'" class="btn btn-primary" style="margin-top:1.5rem; padding: 1rem;">Continue</button>
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--error);">Could not load enrollments. Is the API running?</p>';
        }
    }

    async function loadAvailableCourses() {
        const container = document.getElementById('availableCoursesView');
        try {
            const courses = await apiFetch('/student/courses');
            if (courses.length === 0) {
                container.innerHTML = '<p style="grid-column:1/-1; text-align:center; padding: 3rem; color: var(--text-muted);">No courses available.</p>';
                return;
            }
            container.innerHTML = '';
            courses.forEach(c => {
                container.innerHTML += `
                    <div class="journey-card" style="background: var(--slate-50); border-style: dashed;">
                        <div class="journey-card-content">
                            <span class="badge" style="background: white; color: var(--slate-900); margin-bottom: 1rem;">Course</span>
                            <h3 style="font-size: 1.35rem; font-weight: 800; color: var(--slate-900); margin-bottom:1rem;">${c.title}</h3>
                            <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom:2rem;">${c.description || ''}</p>
                            <button type="button" onclick="enrollCourse(${c.id})" class="btn" style="background: white; border: 1.5px solid var(--slate-200); color: var(--slate-900); padding: 1rem;">Enroll</button>
                        </div>
                    </div>`;
            });
        } catch (e) {
            container.innerHTML = '<p style="grid-column:1/-1;text-align:center;color:var(--error);">Could not load courses.</p>';
        }
    }

    async function enrollCourse(courseId) {
        try {
            await apiFetch(`/student/courses/${courseId}/enroll`, { method: 'POST' });
            alert('Enrolled successfully.');
            window.location.reload();
        } catch (error) {
            alert(error.message || 'Enrollment failed.');
        }
    }
</script>
</body>
</html>
